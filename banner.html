<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>paperjs-offset banner</title>
    <link rel="icon" href="data:,">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #ffffff;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        color: #202124;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: min(100vw, 160vh);
        height: min(100vh, 62.5vw);
        aspect-ratio: 16 / 10;
        background: #ffffff;
      }

      .load-error {
        display: none;
        width: min(100% - 40px, 720px);
        padding: 18px 20px;
        border: 1px solid #d9e0e5;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 14px 34px rgba(27, 43, 52, 0.08);
      }

      .load-error strong {
        display: block;
        margin-bottom: 6px;
      }

      .load-error code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="banner-canvas" width="1600" height="1000" aria-label="paperjs-offset generated banner"></canvas>
    <p id="load-error" class="load-error">
      <strong>Unable to load banner dependencies.</strong>
      Build the local bundle with <code>npm run build</code>, then open this file again.
    </p>

    <script>
      (function() {
        var WIDTH = 1600;
        var HEIGHT = 1000;
        var paperSources = [
          './node_modules/paper/dist/paper-full.min.js'
        ];
        var offsetSources = [
          './dist/index.umd.js'
        ];

        var palette = {
          paper: '#ffffff',
          ink: '#111318',
          cobalt: '#2457d6',
          cyan: '#0b8fab',
          teal: '#0f766e',
          coral: '#ef5664',
          blueWash: '#f3f7ff',
          coralWash: '#fff5f5'
        };

        function loadScript(src) {
          return new Promise(function(resolve, reject) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }

        function loadAny(sources, ready) {
          var index = 0;

          function next() {
            if (ready()) {
              return Promise.resolve();
            }
            if (index >= sources.length) {
              return Promise.reject(new Error('Unable to load script'));
            }
            return loadScript(sources[index++]).then(function() {
              return ready() ? undefined : next();
            }, next);
          }

          return next();
        }

        function showLoadError() {
          document.getElementById('banner-canvas').style.display = 'none';
          document.getElementById('load-error').style.display = 'block';
        }

        function showRenderError(error) {
          var errorNode = document.getElementById('load-error');
          document.getElementById('banner-canvas').style.display = 'none';
          errorNode.style.display = 'block';
          errorNode.innerHTML = '<strong>Unable to render banner.</strong>' +
            '<span>' + (error && error.message ? error.message : 'Unknown render error') + '</span>';
        }

        function hexToRgba(hex, alpha) {
          var value = hex.replace('#', '');
          var red = parseInt(value.slice(0, 2), 16);
          var green = parseInt(value.slice(2, 4), 16);
          var blue = parseInt(value.slice(4, 6), 16);
          return 'rgba(' + red + ', ' + green + ', ' + blue + ', ' + alpha + ')';
        }

        function setStyle(item, style) {
          Object.keys(style).forEach(function(key) {
            item[key] = style[key];
          });
        }

        function drawBackground() {
          new paper.Path.Rectangle({
            point: [0, 0],
            size: [WIDTH, HEIGHT],
            fillColor: palette.paper,
            strokeColor: null
          });
        }

        function makePath(points, closed, sharpIndices) {
          var path = new paper.Path({
            segments: points,
            closed: closed,
            insert: false
          });
          path.smooth({ type: 'continuous' });
          (sharpIndices || []).forEach(function(index) {
            path.segments[index].handleIn = new paper.Point(0, 0);
            path.segments[index].handleOut = new paper.Point(0, 0);
          });
          return path;
        }

        function transformPoint(point, config) {
          var x = point[0];
          var edge = Math.min(1, Math.abs(x) / 220);
          var y = point[1] + config.bend * (1 - edge * edge);
          var scaledX = x * config.scale;
          var scaledY = y * config.scale;
          var angle = config.rotation * Math.PI / 180;
          return [
            config.center[0] + scaledX * Math.cos(angle) - scaledY * Math.sin(angle),
            config.center[1] + scaledX * Math.sin(angle) + scaledY * Math.cos(angle)
          ];
        }

        function transformPoints(points, config) {
          return points.map(function(point) {
            return transformPoint(point, config);
          });
        }

        function offsetPath(source, distance, style) {
          var result = paperjsOffset.offset(source, distance, {
            join: 'round',
            limit: 4,
            algorithm: 'robust',
            insert: false
          });
          setStyle(result, style);
          paper.project.activeLayer.addChild(result);
          return result;
        }

        function offsetStroke(source, width, style) {
          var result = paperjsOffset.offsetStroke(source, width, {
            join: 'round',
            cap: 'round',
            limit: 4,
            algorithm: 'robust',
            insert: false
          });
          setStyle(result, style);
          paper.project.activeLayer.addChild(result);
          return result;
        }

        function makeKoi(config) {
          var bodyPoints = [
            [180, 0], [167, -28], [140, -46], [100, -58],
            [46, -57], [-18, -49], [-86, -34], [-136, -18],
            [-176, -54], [-220, -72], [-202, -18], [-174, 0],
            [-202, 18], [-220, 72], [-176, 54], [-136, 18],
            [-86, 34], [-18, 49], [46, 57], [100, 58],
            [140, 46], [167, 28]
          ];
          var body = makePath(
            transformPoints(bodyPoints, config),
            true,
            []
          );
          var eyeCenter = transformPoint([126, -9], config);
          var eye = new paper.Path.Circle({
            center: eyeCenter,
            radius: 10 * config.scale,
            insert: false
          });

          body.clockwise = true;
          eye.clockwise = false;

          var source = new paper.CompoundPath({ insert: false });
          source.addChildren([body, eye]);
          source.fillRule = 'evenodd';

          var fin = makePath(transformPoints([
            [52, -9], [8, -3], [-42, 36], [24, 31]
          ], config), true, [2]);
          var gill = makePath(transformPoints([
            [123, -35], [106, -15], [104, 10], [116, 29]
          ], config), false);

          return {
            source: source,
            body: body,
            eyeCenter: eyeCenter,
            eyeRadius: 10 * config.scale,
            fin: fin,
            gill: gill
          };
        }

        function drawWake(config) {
          var wake = makePath(transformPoints([
            [-176, 0], [-292, -9], [-408, 16], [-548, -20]
          ], config), false);
          [38, 18].forEach(function(width, index) {
            var color = index === 0 ? config.secondary : config.accent;
            offsetStroke(wake, width, {
              fillColor: hexToRgba(color, 0.018 + index * 0.012),
              strokeColor: hexToRgba(color, 0.7 + index * 0.16),
              strokeWidth: index === 0 ? 2.2 : 1.7
            });
          });
          setStyle(wake, {
            fillColor: null,
            strokeColor: 'rgba(17, 19, 24, 0.18)',
            strokeWidth: 1.4
          });
          paper.project.activeLayer.addChild(wake);
        }

        function drawKoiPatches(config) {
          var patchSets = [
            [[38, -34], [78, -40], [106, -16], [91, 13], [57, 21], [32, -3]],
            [[-52, -4], [-20, -29], [17, -15], [21, 18], [-13, 36], [-49, 24]],
            [[-124, -20], [-88, -31], [-56, -5], [-69, 25], [-108, 27], [-130, 3]]
          ];

          patchSets.forEach(function(points, index) {
            var patch = makePath(transformPoints(points, config), true);
            offsetPath(patch, 6 + index, {
              fillColor: null,
              strokeColor: hexToRgba(config.patchColor, 0.64),
              strokeWidth: 1.6
            });
            setStyle(patch, {
              fillColor: hexToRgba(config.patchColor, index === 1 ? 0.17 : 0.14),
              strokeColor: null
            });
            paper.project.activeLayer.addChild(patch);
          });
        }

        function drawKoi(config) {
          var koi = makeKoi(config);
          var outerDistances = [48, 30, 15];

          outerDistances.forEach(function(distance, index) {
            var color = index === 1 ? config.secondary : config.accent;
            offsetPath(koi.source, distance, {
              fillColor: hexToRgba(color, 0.018 + index * 0.011),
              strokeColor: color,
              strokeWidth: index === 0 ? 2.8 : 2.2
            });
          });

          setStyle(koi.source, {
            fillColor: config.fillColor,
            strokeColor: palette.ink,
            strokeWidth: 3.8
          });
          paper.project.activeLayer.addChild(koi.source);

          [-12].forEach(function(distance) {
            offsetPath(koi.body, distance, {
              fillColor: null,
              strokeColor: config.accent,
              strokeWidth: 2.2
            });
          });

          drawKoiPatches(config);

          offsetPath(koi.fin, 7, {
            fillColor: hexToRgba(config.secondary, 0.035),
            strokeColor: config.secondary,
            strokeWidth: 1.8
          });
          setStyle(koi.fin, {
            fillColor: hexToRgba(config.secondary, 0.055),
            strokeColor: config.secondary,
            strokeWidth: 2
          });
          paper.project.activeLayer.addChild(koi.fin);

          offsetStroke(koi.gill, 7, {
            fillColor: hexToRgba(config.accent, 0.05),
            strokeColor: config.accent,
            strokeWidth: 1.6
          });
          setStyle(koi.gill, {
            fillColor: null,
            strokeColor: palette.ink,
            strokeWidth: 1.6
          });
          paper.project.activeLayer.addChild(koi.gill);

          new paper.Path.Circle({
            center: koi.eyeCenter,
            radius: koi.eyeRadius * 0.36,
            fillColor: palette.ink,
            strokeColor: palette.paper,
            strokeWidth: 1.8
          });
        }

        function drawCenterRipple() {
          var center = new paper.Point(800, 500);
          var source = new paper.Path.Circle({
            center: center,
            radius: 94,
            insert: false
          });

          offsetPath(source, 42, {
            fillColor: null,
            strokeColor: hexToRgba(palette.coral, 0.32),
            strokeWidth: 1.6
          });
          setStyle(source, {
            fillColor: hexToRgba(palette.coral, 0.06),
            strokeColor: null
          });
          paper.project.activeLayer.addChild(source);
        }

        function drawArtwork() {
          var blueKoi = {
            center: [590, 350],
            scale: 1.34,
            rotation: 28,
            bend: -34,
            accent: palette.cobalt,
            secondary: palette.cyan,
            patchColor: palette.coral,
            fillColor: palette.blueWash
          };
          var coralKoi = {
            center: [1010, 650],
            scale: 1.3,
            rotation: 208,
            bend: -34,
            accent: palette.coral,
            secondary: palette.teal,
            patchColor: palette.cobalt,
            fillColor: palette.coralWash
          };

          drawCenterRipple();
          drawWake(blueKoi);
          drawWake(coralKoi);
          drawKoi(blueKoi);
          drawKoi(coralKoi);
        }

        function drawBanner() {
          var canvas = document.getElementById('banner-canvas');
          paper.setup(canvas);
          paper.view.viewSize = new paper.Size(WIDTH, HEIGHT);
          paper.project.activeLayer.removeChildren();

          drawBackground();
          drawArtwork();

          paper.view.update();
          canvas.setAttribute('data-render-state', 'ready');
          window.paperjsOffsetBannerReady = true;
        }

        function init() {
          loadAny(paperSources, function() {
            return !!window.paper;
          }).then(function() {
            return loadAny(offsetSources, function() {
              return !!window.paperjsOffset;
            });
          }).then(function() {
            try {
              drawBanner();
            } catch (error) {
              showRenderError(error);
            }
          }, showLoadError);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
